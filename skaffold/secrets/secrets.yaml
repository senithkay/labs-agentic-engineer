apiVersion: v1
kind: Secret
metadata:
  name: aep-thunder-admin-creds
  namespace: wso2-aep
type: Opaque
stringData:
  client-id: "client-id"
  client-secret: "thunder-admin-client-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: aep-agents-secrets
  namespace: wso2-aep
type: Opaque
stringData:
  AGENTS_JWT_SECRET: "dev-agents-jwt-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: aep-webhook-secrets
  namespace: wso2-aep
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: "dev-webhook-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: wso2-aep
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dev-postgres-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: aep-oauth-secrets
  namespace: wso2-aep
type: Opaque
stringData:
  OAUTH_STATE_SIGNING_KEY: "dev-oauth-state-signing-key"
---
apiVersion: v1
kind: Secret
metadata:
