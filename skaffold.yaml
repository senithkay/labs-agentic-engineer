apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aep

build:
  artifacts:
    - image: ghcr.io/wso2/aep/aep-api
      context: services/aep-api
      docker:
        dockerfile: Dockerfile
        cliFlags:
          - "--build-context=skills=./skills"
    - image: ghcr.io/wso2/aep/agents
      context: .
      custom:
        buildCommand: docker build -f services/agents/Dockerfile -t $IMAGE .
        dependencies:
          paths:
            - services/agents/**/*
            - packages/**/*
            - pnpm-workspace.yaml
            - package.json
            - pnpm-lock.yaml
            - tsconfig.base.json
    - image: ghcr.io/wso2/aep/collab
      context: .
      custom:
        buildCommand: docker build -f services/collab/Dockerfile -t $IMAGE .
        dependencies:
          paths:
            - services/collab/**/*
            - packages/**/*
            - pnpm-workspace.yaml
            - package.json
            - pnpm-lock.yaml
            - tsconfig.base.json
    - image: ghcr.io/wso2/aep/aep-mcp-server
      context: .
      custom:
        buildCommand: docker build -f services/aep-mcp-server/Dockerfile -t $IMAGE .
        dependencies:
          paths:
            - services/aep-mcp-server/**/*
            - pnpm-workspace.yaml
            - package.json
            - pnpm-lock.yaml
            - tsconfig.base.json
    - image: ghcr.io/wso2/aep/console
      context: .
      custom:
        buildCommand: docker build -f apps/console/Dockerfile -t $IMAGE .
        dependencies:
          paths:
            - apps/console/**/*
            - packages/**/*
            - pnpm-workspace.yaml
            - package.json
            - pnpm-lock.yaml
            - tsconfig.base.json
    - image: ghcr.io/wso2/aep/remote-worker
      context: runners/remote-worker
      custom:
        buildCommand: docker build -f Dockerfile --build-context skills=../skills --build-context bal-library-tool=../packages/bal-library-tool --secret id=packagePAT,env=PACKAGE_PAT -t $IMAGE .
        dependencies:
          paths:
            - runners/remote-worker/**/*
            - skills/**/*
          ignore:
            - runners/remote-worker/node_modules/**/*
            - runners/remote-worker/dist/**/*
    - image: ghcr.io/wso2/aep/thunder-app-operator
      context: deployments/single-cluster/resource-types/thunder-app/operator
      docker:
        dockerfile: Dockerfile
  local:
    push: false
    useBuildkit: true

manifests:
  rawYaml:
    - skaffold/namespace.yaml
    - skaffold/addon-namespaces.yaml
    - skaffold/secrets.yaml
    - deployments/single-cluster/resource-types/thunder-app/resourcetype.yaml
    - deployments/single-cluster/resource-types/thunder-app/rbac.yaml
    - deployments/single-cluster/resource-types/postgres-cnpg/resourcetype.yaml
    - deployments/single-cluster/resource-types/postgres-cnpg/rbac.yaml

deploy:
  kubectl: {}
  helm:
    hooks:
      before:
        - host:
            command: ["sh", "skaffold/generate-and-apply.sh"]
            os: [darwin, linux]
            dir: "."
      after:
        - host:
            command: ["sh", "skaffold/thunder-setup.sh"]
            os: [darwin, linux]
            dir: "."
    releases:
      - name: aep-platform
        chartPath: deployments/helm-charts/platform
        namespace: wso2-aep
        createNamespace: true
        valuesFiles:
          - skaffold/helm-values.yaml
        setValueTemplates:
          aepApi.image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_aep_api}}"
          aepApi.image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_aep_api}}"
          aepAgents.image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_agents}}"
          aepAgents.image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_agents}}"
          collab.image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_collab}}"
          collab.image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_collab}}"
          aepMcpServer.image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_aep_mcp_server}}"
          aepMcpServer.image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_aep_mcp_server}}"
          console.image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_console}}"
          console.image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_console}}"
          codingAgentRunner.image: "{{.IMAGE_REPO_ghcr_io_wso2_aep_remote_worker}}:{{.IMAGE_TAG_ghcr_io_wso2_aep_remote_worker}}"
        setValues:
          ### ── Built-in defaults (local dev infrastructure, fixed for k3d) ──
          # Use plain K8s Secrets instead of ESO/OpenBao
          localSecrets.enabled: "true"


          ### ── Overridable defaults (config file — mirrors aectl platform config import) ──
          # thunder.url
          thunder.adminURL: "http://thunder-service.thunder.svc.cluster.local:8090"
          thunder.jwksURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
          # thunder.public_url
          console.thunderPublicURL: "http://thunder.openchoreo.localhost:8080"
          # oc.api_url
          platformAPI.baseURL: "http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080"
          # codingagent.openbao_direct.enabled
          codingAgentDispatch.openBaoDirect.enabled: "true"
          # openbao.addr
          openbao.addr: "http://openbao.openbao.svc.cluster.local:8200"
          # oc.local_org_provisioning.enabled
          localOrgProvisioning.enabled: "true"
          # oc.org_namespace
          localOrgProvisioning.orgNamespace: "default"
          # platform.workspaces.access_mode
          workspaces.accessMode: "ReadWriteOnce"
      - name: thunder-app-operator
        chartPath: deployments/single-cluster/resource-types/thunder-app/operator/helm
        namespace: thunder-app-operator-system
        createNamespace: true
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_ghcr_io_wso2_aep_thunder_app_operator}}"
          image.tag: "{{.IMAGE_TAG_ghcr_io_wso2_aep_thunder_app_operator}}"
      - name: cnpg
        remoteChart: oci://ghcr.io/cloudnative-pg/charts/cloudnative-pg
        version: "0.29.0"
        namespace: cnpg-system
        createNamespace: true
