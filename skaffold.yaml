apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aep

build:
  artifacts: []
  local:
    push: false

manifests:
  rawYaml:
    - skaffold/namespace.yaml
    - skaffold/secrets/secrets.yaml

deploy:
  kubectl:
    hooks:
      before:
        - host:
            command: ["sh", "skaffold/secrets/generate-and-apply.sh"]
            os: [darwin, linux]
