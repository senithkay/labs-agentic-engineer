aep-openbao:
  injector:
    enabled: false
  server:
    standalone:
      enabled: true
    ha:
      enabled: false

aepServer:
  image:
    repository: senithkay/ae
    tag: aep-server
    pullPolicy: Always
  port: 9091
  esoNamespace: external-secrets
  esoServiceAccount: external-secrets
  thunderNamespace: thunder
  thunderRelease: thunder
  host: "aep-server.openchoreo.localhost"

console:
  publicURL: "http://console.openchoreo.localhost:8080"
